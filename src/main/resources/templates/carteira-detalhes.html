<!DOCTYPE html>
<html class="dark" lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="'Zenith | ' + ${carteira.nome}">Zenith | Carteira</title>
    <th:block th:replace="~{fragments/shared :: zenith-head-assets}"></th:block>
</head>
<body class="bg-[#0a0a0a] text-on-surface antialiased relative min-h-screen pb-24">
<div class="fixed inset-0 pointer-events-none bg-terminal-grid opacity-20 z-0"></div>

<th:block th:replace="~{fragments/shared :: zenith-header}"></th:block>

<main class="relative z-10 pt-[140px] max-w-7xl mx-auto px-8">
    <div class="flex justify-between items-end mb-12 border-b border-white/5 pb-8">
        <div>
            <h1 class="text-4xl font-bold text-white tracking-tight mb-4" th:text="${carteira.nome}">Carteira</h1>
            <p class="text-white/40 uppercase tracking-widest text-xs flex items-center gap-6">
                <span>Caixa da Carteira: <span class="text-white text-lg ml-1 font-bold" th:text="'R$ ' + ${#numbers.formatDecimal(carteira.saldoDisponivel, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</span></span>
                <span class="text-white/20">|</span>
                <span>Rendimento Alocado: <span class="text-primary-fixed text-lg ml-1 font-bold" th:text="'+' + ${#numbers.formatDecimal(rendimentoMedio, 1, 'POINT', 2, 'COMMA')} + '%'">+0.00%</span></span>
            </p>
        </div>
        <div class="flex gap-4">
            <button onclick="document.getElementById('modalSaque').classList.remove('hidden')" class="border border-white/10 text-white/60 text-xs font-bold uppercase px-6 py-3 hover:border-error hover:text-error transition-all rounded">Resgatar (Inércia)</button>
            <button onclick="document.getElementById('modalAporte').classList.remove('hidden')" class="bg-primary-fixed text-black text-xs font-bold uppercase px-6 py-3 hover:bg-primary transition-all rounded">Aportar (Inércia)</button>
        </div>
    </div>

    <div class="mb-12">
        <h2 class="text-xs font-bold text-primary uppercase tracking-[0.2em] mb-4 flex items-center gap-2"><span class="material-symbols-outlined text-sm">shopping_cart</span> Terminal de Compra</h2>
        <div class="glass-panel p-8 rounded-xl">
            <form id="formCompra" class="grid grid-cols-1 md:grid-cols-4 gap-6 items-end">
                <input type="hidden" id="txCarteira" th:value="${carteira.id}" />
                <div class="flex flex-col gap-2">
                    <label class="text-[10px] text-white/40 uppercase tracking-widest">Ativo</label>
                    <select id="txAtivo" class="w-full bg-black/40 border-b border-white/20 py-2 outline-none text-sm text-primary" required>
                        <option value="" disabled selected>Selecionar Ativo...</option>
                        <option th:each="ativo : ${ativos}" th:value="${ativo.id}" th:text="${ativo.ticker} + ' - ' + ${ativo.nomeEmpresa}"></option>
                    </select>
                </div>
                <div class="flex flex-col gap-2">
                    <label class="text-[10px] text-white/40 uppercase tracking-widest">Quantidade</label>
                    <input type="number" id="txQtd" class="input-minimal w-full py-2 text-sm" required min="1" />
                </div>
                <div class="flex flex-col gap-2">
                    <label class="text-[10px] text-white/40 uppercase tracking-widest">Preço Unitário (R$)</label>
                    <input type="number" step="0.01" id="txPreco" class="input-minimal w-full py-2 text-sm" required min="0.01" />
                </div>
                <button type="submit" class="w-full bg-primary-fixed text-black text-[10px] font-bold py-3 hover:bg-primary uppercase rounded">Executar Ordem</button>
            </form>
        </div>
    </div>

    <div>
        <h2 class="text-xs font-bold text-white/50 uppercase tracking-[0.2em] mb-4 flex items-center gap-2"><span class="material-symbols-outlined text-sm">layers</span> Posições Estruturadas</h2>
        <div class="glass-panel rounded-xl overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                <tr class="border-b border-white/5 bg-white/5 text-[10px] text-white/40 uppercase tracking-widest">
                    <th class="p-4 font-normal">Ativo / Código</th>
                    <th class="p-4 font-normal text-right">Qtd</th>
                    <th class="p-4 font-normal text-right">Preço Médio</th>
                    <th class="p-4 font-normal text-right">Total Alocado</th>
                    <th class="p-4 font-normal text-right border-l border-white/5">Rentabilidade</th>
                    <th class="p-4 font-normal class-center">Ações</th>
                </tr>
                </thead>
                <tbody class="text-sm">
                <tr th:each="pos : ${carteira.posicoes}" th:if="${pos.quantidadeAtual > 0}" class="border-b border-white/5 hover:bg-white/5 transition-colors">
                    <td class="p-4"><span class="font-bold text-white" th:text="${pos.ativo.ticker}"></span></td>
                    <td class="p-4 text-right text-white font-bold" th:text="${pos.quantidadeAtual}"></td>
                    <td class="p-4 text-right text-white/40" th:text="'R$ ' + ${#numbers.formatDecimal(pos.precoMedio, 1, 'POINT', 2, 'COMMA')}"></td>
                    <td class="p-4 text-right text-primary-fixed font-bold" th:text="'R$ ' + ${#numbers.formatDecimal(pos.quantidadeAtual * pos.precoMedio, 1, 'POINT', 2, 'COMMA')}"></td>
                    <td class="p-4 text-right border-l border-white/5 text-primary font-bold" th:text="'+' + ${pos.ativo.taxaRendimentoEstimada} + '%'"></td>
                    <td class="p-4 text-center">
                        <button type="button" th:data-id="${pos.ativo.id}" th:data-ticker="${pos.ativo.ticker}" th:data-qtd="${pos.quantidadeAtual}" onclick="abrirModalVenda(this.dataset.id, this.dataset.ticker, this.dataset.qtd)" class="bg-error/10 text-error border border-error/20 hover:bg-error hover:text-black transition-all px-4 py-1.5 text-[10px] font-bold uppercase tracking-widest rounded">Vender</button>
                    </td>
                </tr>
                <tr th:if="${carteira.posicoes == null || carteira.posicoes.?[quantidadeAtual > 0].isEmpty()}">
                    <td colspan="6" class="p-8 text-center text-white/20 uppercase tracking-widest text-xs">Nenhum ativo alocado.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div id="modalVenda" class="hidden fixed inset-0 z-[100] bg-black/90 backdrop-blur-sm flex items-center justify-center">
    <div class="card-stat p-8 max-w-sm w-full rounded-2xl border border-error/30">
        <h3 class="text-xl font-bold mb-2 text-error">Liquidação de Ativo</h3>
        <p class="text-[10px] text-white/40 mb-6 uppercase">Ativo: <span id="vdTicker" class="text-white font-bold"></span></p>
        <form id="formVenda" class="space-y-4">
            <input type="hidden" id="vdAtivoId" />
            <input type="number" id="vdQtd" required class="input-minimal w-full" placeholder="Quantidade" />
            <input type="number" id="vdPreco" step="0.01" required class="input-minimal w-full" placeholder="Preço (R$)" />
            <div class="flex justify-end gap-4 pt-4">
                <button type="button" onclick="document.getElementById('modalVenda').classList.add('hidden')" class="text-[10px] uppercase text-white/50">Cancelar</button>
                <button type="submit" class="bg-error text-black px-6 py-2 text-[10px] font-bold uppercase rounded">Confirmar Venda</button>
            </div>
        </form>
    </div>
</div>

<div id="modalAporte" class="hidden fixed inset-0 z-[100] bg-black/90 backdrop-blur-sm flex items-center justify-center">
    <div class="card-stat p-8 max-w-sm w-full rounded-2xl">
        <h3 class="text-xl font-bold mb-4 text-primary">Aporte Interno</h3>
        <form id="formAporte" class="space-y-4">
            <input type="number" id="apValor" step="0.01" required placeholder="Valor (R$)" class="input-minimal w-full text-lg" />
            <div class="flex justify-end gap-4 pt-4">
                <button type="button" onclick="document.getElementById('modalAporte').classList.add('hidden')" class="text-[10px] uppercase text-white/50">Cancelar</button>
                <button type="submit" class="bg-primary text-black px-6 py-2 text-[10px] font-bold uppercase rounded">Aportar</button>
            </div>
        </form>
    </div>
</div>

<div id="modalSaque" class="hidden fixed inset-0 z-[100] bg-black/90 backdrop-blur-sm flex items-center justify-center">
    <div class="card-stat p-8 max-w-sm w-full rounded-2xl">
        <h3 class="text-xl font-bold mb-4 text-white">Resgatar Recursos</h3>
        <form id="formSaque" class="space-y-4">
            <input type="number" id="sqValor" step="0.01" required placeholder="Valor (R$)" class="input-minimal w-full text-lg" />
            <div class="flex justify-end gap-4 pt-4">
                <button type="button" onclick="document.getElementById('modalSaque').classList.add('hidden')" class="text-[10px] uppercase text-white/50">Cancelar</button>
                <button type="submit" class="bg-white text-black px-6 py-2 text-[10px] font-bold uppercase rounded">Resgatar</button>
            </div>
        </form>
    </div>
</div>

<script>
    const csrfToken = document.querySelector('meta[name="_csrf"]').content;
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;
    const idCarteira = document.getElementById('txCarteira').value;

    function abrirModalVenda(ativoId, ticker, maxQtd) {
        document.getElementById('vdAtivoId').value = ativoId;
        document.getElementById('vdTicker').innerText = ticker;
        document.getElementById('vdQtd').max = maxQtd;
        document.getElementById('vdQtd').value = maxQtd;
        document.getElementById('modalVenda').classList.remove('hidden');
    }

    document.getElementById('formVenda').addEventListener('submit', function(e){
        e.preventDefault();
        fetch('/api/transacoes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', [csrfHeader]: csrfToken },
            body: JSON.stringify({
                carteiraId: idCarteira, ativoId: document.getElementById('vdAtivoId').value, tipo: 'VENDA',
                quantidade: parseInt(document.getElementById('vdQtd').value), precoUnitario: parseFloat(document.getElementById('vdPreco').value)
            })
        }).then(res => res.ok ? window.location.reload() : alert("Erro na liquidação"));
    });

    document.getElementById('formCompra').addEventListener('submit', function(e){
        e.preventDefault();
        fetch('/api/transacoes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', [csrfHeader]: csrfToken },
            body: JSON.stringify({
                carteiraId: idCarteira, ativoId: document.getElementById('txAtivo').value, tipo: 'COMPRA',
                quantidade: parseInt(document.getElementById('txQtd').value), precoUnitario: parseFloat(document.getElementById('txPreco').value)
            })
        }).then(async res => res.ok ? window.location.reload() : alert((await res.json()).erro || "Erro"));
    });

    document.getElementById('formAporte').addEventListener('submit', function(e){
        e.preventDefault();
        fetch(`/api/carteiras/${idCarteira}/aporte`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', [csrfHeader]: csrfToken },
            body: JSON.stringify({ valor: parseFloat(document.getElementById('apValor').value) })
        }).then(res => res.ok ? window.location.reload() : alert("Erro"));
    });

    document.getElementById('formSaque').addEventListener('submit', function(e){
        e.preventDefault();
        fetch(`/api/carteiras/${idCarteira}/saque`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', [csrfHeader]: csrfToken },
            body: JSON.stringify({ valor: parseFloat(document.getElementById('sqValor').value) })
        }).then(res => res.ok ? window.location.reload() : alert("Erro"));
    });
</script>
</body>
</html>
