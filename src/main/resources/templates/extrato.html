<!DOCTYPE html>
<html class="dark" lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Zenith | Extrato de Transações</title>
  <th:block th:replace="~{fragments/shared :: zenith-head-assets}"></th:block>
</head>
<body class="bg-[#0a0a0a] text-on-surface antialiased relative min-h-screen pb-24">
<div class="fixed inset-0 pointer-events-none bg-terminal-grid opacity-20 z-0"></div>

<th:block th:replace="~{fragments/shared :: zenith-header}"></th:block>

<main class="relative z-10 pt-[140px] max-w-7xl mx-auto px-8">
  <div class="mb-12 border-b border-white/5 pb-6 flex justify-between items-end">
    <div>
      <h1 class="text-4xl font-bold text-white tracking-tight mb-2">Ledger Histórico</h1>
      <p class="text-white/40 uppercase tracking-widest text-xs">Registro cronológico de custódias e operações financeiras.</p>
    </div>
    <div class="text-xs text-primary-fixed border border-primary/20 px-4 py-2 uppercase tracking-widest">
      Registros: <span th:text="${#lists.size(transacoes)}">0</span>
    </div>
  </div>

  <div class="glass-panel rounded-xl overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
        <tr class="border-b border-white/5 bg-white/5 text-[10px] text-white/40 uppercase tracking-widest">
          <th class="p-4 font-normal">Data / Registro</th>
          <th class="p-4 font-normal">Arquitetura</th>
          <th class="p-4 font-normal">Ativo</th>
          <th class="p-4 font-normal">Operação</th>
          <th class="p-4 font-normal text-right">Qtd</th>
          <th class="p-4 font-normal text-right">Preço Un.</th>
          <th class="p-4 font-normal text-right">Total Residual</th>
        </tr>
        </thead>
        <tbody class="text-sm">
        <tr th:each="tx : ${transacoes}" class="border-b border-white/5 hover:bg-white/5 transition-colors">
          <td class="p-4 text-white/40" th:text="${#temporals.format(tx.dataOperacao, 'dd/MM/yyyy HH:mm:ss')}"></td>
          <td class="p-4 text-white" th:text="${tx.carteira.nome}"></td>
          <td class="p-4"><span class="font-bold text-white" th:text="${tx.ativo.ticker}"></span></td>
          <td class="p-4">
            <span class="font-bold text-white" th:text="${tx.ativo != null ? tx.ativo.ticker : tx.tipo.name()}"></span>
          </td>
          <td class="p-4 text-right text-white" th:text="${tx.quantidade}"></td>
          <td class="p-4 text-right text-white/40" th:text="'R$ ' + ${#numbers.formatDecimal(tx.precoUnitario, 1, 'POINT', 2, 'COMMA')}"></td>
          <td class="p-4 text-right font-bold" th:classappend="${tx.tipo.name() == 'COMPRA'} ? 'text-error' : 'text-primary-fixed'" th:text="(${tx.tipo.name() == 'COMPRA'} ? '- R$ ' : '+ R$ ') + ${#numbers.formatDecimal(tx.calcularValorTotal(), 1, 'POINT', 2, 'COMMA')}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(transacoes)}">
          <td colspan="7" class="p-12 text-center text-white/20 uppercase tracking-widest text-xs">Nenhum histórico operacional localizado no node.</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
</body>
</html>
