<!DOCTYPE html>
<html class="dark" lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Zenith | Configurações do Node</title>
  <th:block th:replace="~{fragments/shared :: zenith-head-assets}"></th:block>
</head>
<body class="bg-[#0a0a0a] text-on-surface antialiased relative min-h-screen pb-24">
<div class="fixed inset-0 pointer-events-none bg-terminal-grid opacity-20 z-0"></div>

<th:block th:replace="~{fragments/shared :: zenith-header}"></th:block>

<main class="relative z-10 pt-[140px] max-w-4xl mx-auto px-8">
  <div class="mb-12 border-b border-white/5 pb-6">
    <h1 class="text-4xl font-bold text-white tracking-tight mb-2">Configurações de Rede</h1>
    <p class="text-white/40 uppercase tracking-widest text-xs">Gerenciamento de credenciais e chaves criptográficas de autenticação.</p>
  </div>

  <div class="grid grid-cols-1 gap-12">
    <section class="glass-panel p-8 rounded-2xl">
      <div class="flex items-center gap-3 mb-6 border-b border-white/5 pb-4">
        <span class="material-symbols-outlined text-primary">account_circle</span>
        <h2 class="text-xs text-primary uppercase tracking-[0.2em] font-bold">Identidade Operacional</h2>
      </div>
      <div th:if="${sucessoDados}" class="mb-6 p-4 border border-primary bg-primary/5 text-primary-fixed text-xs uppercase tracking-widest">
        <span th:text="${sucessoDados}"></span>
      </div>
      <form th:action="@{/perfil/atualizar}" method="POST" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-2">
            <label class="text-[10px] text-white/40 uppercase tracking-wider block">Nome do Operador</label>
            <input type="text" name="nome" th:value="${investidor.nome}" required class="input-minimal w-full py-2" />
          </div>
          <div class="space-y-2">
            <label class="text-[10px] text-white/20 uppercase tracking-wider block">Chave Identificadora (E-mail)</label>
            <input type="email" th:value="${investidor.email}" disabled class="input-minimal w-full py-2 opacity-40 cursor-not-allowed" />
          </div>
        </div>
        <div class="flex justify-end pt-4">
          <button type="submit" class="bg-primary-fixed text-black text-xs font-bold px-6 py-3 uppercase rounded hover:bg-primary transition-colors">Atualizar Cadastro</button>
        </div>
      </form>
    </section>

    <section class="glass-panel p-8 rounded-2xl">
      <div class="flex items-center gap-3 mb-6 border-b border-white/5 pb-4">
        <span class="material-symbols-outlined text-primary">shield</span>
        <h2 class="text-xs text-primary uppercase tracking-[0.2em] font-bold">Rotação de Segurança</h2>
      </div>
      <div th:if="${sucessoSenha}" class="mb-6 p-4 border border-primary bg-primary/5 text-primary-fixed text-xs uppercase tracking-widest">
        <span th:text="${sucessoSenha}"></span>
      </div>
      <div th:if="${erroSenha}" class="mb-6 p-4 border border-error bg-error/5 text-error text-xs uppercase tracking-widest">
        <span th:text="${erroSenha}"></span>
      </div>
      <form th:action="@{/perfil/senha}" method="POST" class="space-y-6">
        <div class="space-y-2">
          <label class="text-[10px] text-white/40 uppercase tracking-wider block">Chave Atual</label>
          <input type="password" name="senhaAtual" required placeholder="••••••••••••" class="input-minimal w-full py-2 tracking-widest" />
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-2">
            <label class="text-[10px] text-white/40 uppercase tracking-wider block">Nova Chave Criptográfica</label>
            <input type="password" name="novaSenha" required placeholder="••••••••••••" class="input-minimal w-full py-2 tracking-widest" />
          </div>
          <div class="flex flex-col justify-end">
            <p class="text-[10px] text-white/30 uppercase leading-relaxed">Exigência algorítmica: Mínimo de 12 dígitos com verificação de entropia.</p>
          </div>
        </div>
        <div class="flex justify-end pt-4">
          <button type="submit" class="border border-primary text-primary hover:bg-primary hover:text-black text-xs font-bold px-6 py-3 uppercase rounded transition-all">Rotacionar Token</button>
        </div>
      </form>
    </section>
  </div>
</main>
</body>
</html>
