<!DOCTYPE html>
<html class="dark" lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Zenith | Analytics Engine</title>
  <th:block th:replace="~{fragments/shared :: zenith-head-assets}"></th:block>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-[#0a0a0a] text-on-surface antialiased relative min-h-screen pb-24">
<div class="fixed inset-0 pointer-events-none bg-terminal-grid opacity-20 z-0"></div>

<th:block th:replace="~{fragments/shared :: zenith-header}"></th:block>

<main class="relative z-10 pt-[140px] max-w-7xl mx-auto px-8">
  <div class="mb-12 border-b border-white/5 pb-6">
    <h1 class="text-4xl font-bold text-white tracking-tight mb-2">Analytics Engine</h1>
    <p class="text-white/40 uppercase tracking-widest text-xs">Telemetria de distribuição patrimonial e vetores de risco.</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
    <div class="card-stat p-6 rounded-xl">
      <p class="text-[10px] text-white/40 mb-2 uppercase tracking-widest">Patrimônio Consolidado</p>
      <p id="kpi-patrimonio" class="text-3xl font-bold text-primary-fixed">R$ 0,00</p>
    </div>
    <div class="card-stat p-6 rounded-xl">
      <p class="text-[10px] text-white/40 mb-2 uppercase tracking-widest">Liquidez Disponível</p>
      <p id="kpi-caixa" class="text-3xl font-bold text-white">R$ 0,00</p>
    </div>
    <div class="card-stat p-6 rounded-xl">
      <p class="text-[10px] text-white/40 mb-2 uppercase tracking-widest">Arquiteturas Ativas</p>
      <p class="text-3xl font-bold text-white" th:text="${#lists.size(carteiras)}">0</p>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
    <div class="glass-panel p-8 rounded-2xl">
      <div class="flex items-center gap-2 mb-6 text-white/60"><span class="material-symbols-outlined">pie_chart</span><h2 class="text-xs uppercase tracking-widest font-bold">Distribuição por Vetor</h2></div>
      <div class="relative h-64 w-full flex justify-center"><canvas id="chartCategorias"></canvas></div>
    </div>
    <div class="glass-panel p-8 rounded-2xl">
      <div class="flex items-center gap-2 mb-6 text-white/60"><span class="material-symbols-outlined">bar_chart</span><h2 class="text-xs uppercase tracking-widest font-bold">Custódia por Arquitetura</h2></div>
      <div class="relative h-64 w-full"><canvas id="chartCarteiras"></canvas></div>
    </div>
  </div>
</main>

<script th:inline="javascript">
  const carteiras = /*[[${carteiras}]]*/ [];
  let totalCaixa = 0, totalInvestido = 0;
  const categoriasMap = {}, carteirasLabels = [], carteirasData = [];

  carteiras.forEach(c => {
    let patCarteira = c.saldoDisponivel;
    totalCaixa += c.saldoDisponivel;
    carteirasLabels.push(c.nome);
    if (c.posicoes) {
      c.posicoes.forEach(p => {
        if (p.quantidadeAtual > 0) {
          const val = p.quantidadeAtual * p.precoMedio;
          patCarteira += val;
          totalInvestido += val;
          categoriasMap[p.ativo.categoria] = (categoriasMap[p.ativo.categoria] || 0) + val;
        }
      });
    }
    carteirasData.push(patCarteira);
  });

  const patrimonioTotal = totalCaixa + totalInvestido;
  document.getElementById('kpi-patrimonio').innerText = 'R$ ' + patrimonioTotal.toLocaleString('pt-BR', {minimumFractionDigits: 2});
  document.getElementById('kpi-caixa').innerText = 'R$ ' + totalCaixa.toLocaleString('pt-BR', {minimumFractionDigits: 2});

  Chart.defaults.color = '#b9ccaf';
  Chart.defaults.font.family = "'JetBrains Mono', monospace";

  new Chart(document.getElementById('chartCategorias').getContext('2d'), {
    type: 'doughnut',
    data: {
      labels: Object.keys(categoriasMap).length ? Object.keys(categoriasMap) : ['Caixa Puro'],
      datasets: [{
        data: Object.keys(categoriasMap).length ? Object.values(categoriasMap) : [1],
        backgroundColor: ['#77ff61', '#00ff00', '#3b4b35', '#b9ccaf'], borderColor: '#121414', borderWidth: 2
      }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } }, cutout: '75%' }
  });

  new Chart(document.getElementById('chartCarteiras').getContext('2d'), {
    type: 'bar',
    data: {
      labels: carteirasLabels,
      datasets: [{ data: carteirasData, backgroundColor: 'rgba(119, 255, 97, 0.15)', borderColor: '#77ff61', borderWidth: 1, borderRadius: 4 }]
    },
    options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' } }, x: { grid: { display: false } } }, plugins: { legend: { display: false } } }
  });
</script>
</body>
</html>
